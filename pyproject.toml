[project]
name = "dropwatch-apollo"
version = "0.3.0"
description = "Minimal single-view FastEye RLE drop recorder"
authors = [
  { name = "Adrian Rohner", email = "arohner@hamilton.ch" },
  { name = "Jonas Hilti", email = "jhilti@hamilton.ch" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24.0",
  "opencv-python>=4.10.0.84",
  "typing-extensions>=4.12.2",
]

[project.scripts]
dwa = "dropwatch_apollo.__main__:main"

[project.optional-dependencies]
evaluation = [
  "pandas>=2.0",
]

[dependency-groups]
test = [
  "pandas>=2.0",
  "pytest",
  "pytest-cov",
]
dev = [
  "build",
  "mypy",
  "ruff",
  { include-group = "test" },
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dropwatch_apollo", "recorder"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["dropwatch_apollo"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201"]
"tests/*" = ["ANN", "D", "PLR2004", "S101", "SLF001"]

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
exclude = ["^scripts/", "^tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
